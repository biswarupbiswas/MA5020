<div class="md-copyright">
  {% if config.copyright %}
    <div class="md-copyright__highlight">
      {{ config.copyright }}
    </div>
  {% endif %}
  <div class="visitor-counter-group">
    <div class="visitor-counter" title="Total Site Visitors">
      <span class="visitor-counter-icon">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
      </span>
      <span class="visitor-label">Visitors:</span>
      <span id="totalVisitorCount" class="visitor-num">0</span>
    </div>
    <div class="online-counter" title="Currently Active Visitors">
      <span class="pulse-dot"></span>
      <span class="online-label">Online:</span>
      <span id="onlineCount" class="online-num">1</span>
    </div>
  </div>
</div>
